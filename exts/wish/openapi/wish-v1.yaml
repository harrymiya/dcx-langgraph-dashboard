openapi: 3.1.0
info:
  title: DFP Wish API
  version: 1.0.0
  description: >-
    Versioned application-service contract for business owned by Wish. This is
    a target contract, not evidence that routes or production integrations exist.
    APP BFF and Admin BFF are channel adapters inside DFP Wish; both call the
    same Wish application services and domain write master. They do not own
    business state machines, persistence, or a second backend. The 35 selected
    MAPP migration tasks continue to call MAPP server under its existing service
    contract and are outside this API.
servers:
  - url: /api/wish/v1
    description: Versioned Wish application-service API base path
security:
  - wishAuthenticatedChannel: []
x-wish-contract:
  apiVersion: v1
  owner: API-01
  status: target-contract
  applicationServiceBoundary:
    callerContext: Wish API/application service validates trusted channel identity before invoking a use case.
    serverResolvedAuthorizationFacts:
      - principal
      - tenant
      - site
      - subject
      - relationship
      - purpose
      - consent
      - fieldScope
    clientSuppliedValuesAreHintsOnly:
      - siteId
      - subjectId
    neverAcceptedAsAuthorizationFacts:
      - tenantId
      - principalId
      - relationshipId
      - consentId
      - fieldScope
      - role
    fieldDecision: >-
      The server intersects requested projections with the operation allowlist
      and the current principal, relationship, purpose, consent, and field-scope
      decision. A field name supplied by a client never grants access.
  channelOwnership:
    appBff: >-
      Channel adaptation and DTO mapping only; calls Wish application services.
      It does not own domain rules, a database, or a second business backend.
    adminBff: >-
      Channel adaptation and DTO mapping only; calls the same Wish application
      services and write master. This contract does not change administrator
      authentication or credential handling.
    formalAppMigration: >-
      Selected MAPP pages call MAPP server under its existing service contract;
      they do not route through Wish BFF, Wish API, or Wish DDD.
  idempotency:
    requiredFor: every state-changing command
    scope: server-resolved tenant, site, operation, and idempotency key
    replay: same key and same canonical request returns the original outcome
    conflict: same key with a different canonical request returns IDEMPOTENCY_CONFLICT
    retry: ambiguous command outcomes may only be retried with the same key or checked by a read operation
    keyContent: opaque, 1-128 safe ASCII characters; contains no PII or credentials
  pagination:
    mode: opaque-cursor
    defaultLimit: 20
    maximumLimit: 100
    cursorBinding: >-
      Cursor is opaque and server-bound to the resolved tenant/site, filters,
      ordering, purpose, and authorization scope. It cannot grant or widen scope.
    ordering: fixed stable server ordering per operation; arbitrary sort paths are not accepted
    offset: not used by these resource APIs; any future reporting offset is separately bounded
  compatibility:
    routeVersion: major version in /v1
    compatibleChanges: >-
      Add new routes and optional request/response properties without changing
      existing semantics. Clients ignore unknown response properties and map
      unknown error codes to a generic failure.
    breakingChanges: >-
      Removing or renaming a route/property, changing a type or meaning,
      tightening an existing request, changing authorization or idempotency
      semantics, or changing an existing error mapping requires a new major
      route version. Enum expansion is treated as potentially breaking for
      generated clients and requires an explicit compatibility review.
    deprecation: >-
      Publish a migration notice and keep the old major route available for an
      approved overlap window; its duration is set by release governance, not
      invented by this contract.
  codeGeneration:
    sourceOfTruth: this OpenAPI document
    generatedCode: >-
      Generated clients, DTOs, and schemas are disposable outputs. Never edit
      generated files by hand; change this contract, regenerate, and review the
      generated diff. Hand-written adapters must remain outside generated paths.
    generatorConfiguration: versioned alongside the generating pipeline; not embedded in generated files
  errorHandling:
    publicMessage: safe and non-sensitive; never includes SQL, provider details, rejected values, tokens, secrets, or health-record content
    retryable: explicit on every error; true only when a safe retry is defined
    retryAfter: >-
      When retryable and a delay is known, return retryAfterSeconds and the HTTP
      Retry-After header. RATE_LIMITED always supplies both. A client does not
      retry a command with a new idempotency key.
    paymentStatusUnknown: >-
      PAYMENT_STATUS_UNKNOWN is not a blind command retry; first query Wish for
      the operation result using the original request/idempotency reference.
    catalog:
      httpStatus:
        BAD_REQUEST: 400
        API_VERSION_MISMATCH: 400
        VALIDATION_FAILED: 422
        FILTER_NOT_ALLOWED: 400
        FIELD_NOT_ALLOWED: 400
        AUTH_REQUIRED: 401
        TOKEN_AUDIENCE_INVALID: 401
        SCOPE_DENIED: 403
        FIELD_SCOPE_DENIED: 403
        SITE_SCOPE_DENIED: 403
        CROSS_SITE_REFERENCE_DENIED: 403
        CONSENT_REQUIRED: 403
        RELATIONSHIP_INVALID: 403
        RESOURCE_NOT_FOUND: 404
        IDEMPOTENCY_KEY_REQUIRED: 400
        IDEMPOTENCY_CONFLICT: 409
        VERSION_CONFLICT: 409
        RESOURCE_SLOT_CONFLICT: 409
        INVALID_STATE_TRANSITION: 409
        RATE_LIMITED: 429
        DEPENDENCY_UNAVAILABLE: 503
        PAYMENT_STATUS_UNKNOWN: 503
        INTERNAL_ERROR: 500
      retryableCodes: [RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
      retryAfterRequiredCodes: [RATE_LIMITED]
paths:
  /customers:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers visible to the resolved caller
      description: >-
        Wish application service resolves customer and employee visibility from
        principal, tenant/site, current relationship, purpose, consent, and field
        scope. Search and projection fields are allowlisted; hidden objects are
        not disclosed.
      x-wish-result-schema: CustomerSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /relationships:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listRelationships
      tags: [relationships]
      summary: List relationships visible to the resolved caller
      description: Relationship existence is not itself permission to read a subject's data.
      x-wish-result-schema: RelationshipSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /consents:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listConsents
      tags: [consents]
      summary: List consent records visible to the resolved caller
      description: Consent evidence is versioned; revocation does not overwrite prior evidence.
      x-wish-result-schema: ConsentSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /health-records:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listHealthRecords
      tags: [health]
      summary: List health record references visible to the resolved caller
      description: >-
        Owner confirmation and field-level consent are required before health
        content can be returned. The v1 summary does not expose encrypted
        payloads, clinical free text, or report contents.
      x-wish-result-schema: HealthRecordSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /service-catalog:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listServiceCatalog
      tags: [service-catalog]
      summary: List Wish service catalog entries
      description: Service definitions and published versions are owned by Wish; price and qualification rules remain subject to confirmed business inputs.
      x-wish-result-schema: ServiceSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /appointments:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments visible to the resolved caller
      x-wish-result-schema: AppointmentSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Request an appointment through the Wish booking application service
      description: >-
        The application service revalidates the selected site and subject against
        trusted principal, tenant, relationship, purpose, consent, service
        eligibility, and capacity. Resource locks and appointment facts commit
        atomically under the Wish write master. A client selection never supplies
        the authoritative tenant, actor, relationship, consent, or field scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppointmentRequest' }
      responses:
        '201': { $ref: '#/components/responses/AppointmentCreated' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '409': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /appointments/{appointmentId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
      - name: appointmentId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get an appointment visible to the resolved caller
      description: Out-of-scope records are not disclosed; the API may return RESOURCE_NOT_FOUND.
      responses:
        '200': { $ref: '#/components/responses/AppointmentRead' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /appointments/{appointmentId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
      - name: appointmentId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    post:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Request appointment cancellation through the Wish booking application service
      description: Cancellation policy, actor authorization, expected version, and any refund state are revalidated server-side; cancellation does not assert a payment refund.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelAppointmentRequest' }
      responses:
        '200': { $ref: '#/components/responses/AppointmentRead' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '409': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /work-orders:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listWorkOrders
      tags: [fulfillment]
      summary: List work orders visible to the resolved caller
      x-wish-result-schema: WorkOrderSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /service-records:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listServiceRecords
      tags: [fulfillment]
      summary: List service record references visible to the resolved caller
      description: Service record bodies are not included in list responses; authorized detail and correction contracts must remain append-only and field-scoped.
      x-wish-result-schema: ServiceRecordSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /follow-ups:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listFollowUps
      tags: [scrm]
      summary: List follow-up tasks visible to the resolved caller
      x-wish-result-schema: FollowUpSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /notifications:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notification status visible to the resolved caller
      description: The channel is a transport receipt source; delivery status does not change consent, appointment, or ledger facts.
      x-wish-result-schema: NotificationSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /service-rights:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listServiceRights
      tags: [service-ledger]
      summary: List Wish service rights visible to the resolved caller
      description: Wish owns service rights; Commerce/MER remains the writer for mall orders and mall ledgers.
      x-wish-result-schema: ServiceRightSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
  /service-ledger:
    parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/ApiVersion'
    get:
      operationId: listServiceLedgerEntries
      tags: [service-ledger]
      summary: List minimal Wish service-ledger references visible to the resolved caller
      description: >-
        Ledger facts are append-only and owned by Wish. This list is a minimized
        reference; it does not expose monetary values or Commerce/MER ledger data.
      x-wish-result-schema: ServiceLedgerSummary
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SiteSelection'
        - $ref: '#/components/parameters/SubjectSelection'
        - $ref: '#/components/parameters/FieldSelection'
      responses:
        '200': { $ref: '#/components/responses/WishCollection' }
        '400': { $ref: '#/components/responses/WishError' }
        '401': { $ref: '#/components/responses/WishError' }
        '403': { $ref: '#/components/responses/WishError' }
        '404': { $ref: '#/components/responses/WishError' }
        '422': { $ref: '#/components/responses/WishError' }
        '429': { $ref: '#/components/responses/WishError' }
        '503': { $ref: '#/components/responses/WishError' }
        default: { $ref: '#/components/responses/WishError' }
components:
  securitySchemes:
    wishAuthenticatedChannel:
      type: http
      scheme: bearer
      description: >-
        Authenticated Wish channel context validated at the Wish API boundary.
        Issuer, credential lifecycle, and administrator authentication are owned
        by identity/security contracts and are not changed by API-01.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional trace candidate. Wish validates it or generates a canonical request ID and always returns that canonical value.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Optional validated cross-service trace ID; defaults to the canonical request ID when omitted.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    ApiVersion:
      name: X-Wish-API-Version
      in: header
      required: false
      description: Optional request assertion; when present it must match the /v1 route. The server always returns this header.
      schema: { type: string, const: v1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on every command. Opaque key scoped by resolved tenant/site and operation; same key plus same canonical request replays the original outcome.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Expected resource or schedule version for a command with concurrent state.
      schema: { type: string, minLength: 1, maxLength: 128 }
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size; fixed default 20 and maximum 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to server-resolved scope and stable operation ordering.
      schema: { type: string, minLength: 1, maxLength: 2048, pattern: '^[A-Za-z0-9._~+/=-]{1,2048}$' }
    SiteSelection:
      name: siteId
      in: query
      required: false
      description: Selection hint only. Wish resolves and checks the site against principal, tenant, role, resource ownership, relationship, purpose, and consent.
      schema: { type: string, minLength: 1, maxLength: 128 }
    SubjectSelection:
      name: subjectId
      in: query
      required: false
      description: Selection hint only. Wish resolves subject access from current principal, relationship, purpose, consent, and field scope.
      schema: { type: string, minLength: 1, maxLength: 128 }
    FieldSelection:
      name: fields
      in: query
      required: false
      description: Optional projection selection from the global v1 field allowlist; it grants no access and is intersected with the operation and server field scope.
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        maxItems: 32
        items: { $ref: '#/components/schemas/FieldKey' }
  headers:
    RequestId:
      description: Canonical server request identifier for this attempt.
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CorrelationId:
      description: Validated caller trace ID or generated request ID fallback.
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ApiVersion:
      description: API major version served by this response.
      required: true
      schema: { type: string, const: v1 }
    RetryAfter:
      description: Present only when retryable is true and a safe delay is known; same number of seconds as error.retryAfterSeconds.
      required: false
      schema: { type: integer, minimum: 1 }
  responses:
    WishCollection:
      description: Successful cursor-paginated Wish resource collection. Each operation declares its result summary schema.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        X-Wish-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WishCollectionEnvelope' }
    AppointmentCreated:
      description: Appointment request accepted by the Wish application service.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        X-Wish-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppointmentEnvelope' }
    AppointmentRead:
      description: Appointment representation filtered by the resolved field scope.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        X-Wish-API-Version: { $ref: '#/components/headers/ApiVersion' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AppointmentEnvelope' }
    WishError:
      description: Stable, user-safe error envelope. Retry-After is omitted when no safe retry delay applies.
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        X-Wish-API-Version: { $ref: '#/components/headers/ApiVersion' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WishErrorEnvelope' }
  schemas:
    EnvelopeMeta:
      type: object
      additionalProperties: false
      required: [requestId, correlationId, apiVersion, idempotencyKey]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        correlationId: { type: string, minLength: 1, maxLength: 128 }
        apiVersion: { type: string, const: v1 }
        idempotencyKey: { type: [string, 'null'], maxLength: 128, description: Echoed opaque key for command correlation; null for reads. }
    WishSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { type: object, description: Operation-specific allowlisted DTO. }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
        error: { type: 'null' }
    WishErrorEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, error]
      properties:
        data: { type: 'null' }
        meta: { $ref: '#/components/schemas/EnvelopeMeta' }
        error: { $ref: '#/components/schemas/WishError' }
    WishError:
      type: object
      additionalProperties: false
      required: [code, message, retryable, retryAfterSeconds, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          minLength: 1
          maxLength: 240
          description: Safe user-facing text; no internal exception, rejected input, sensitive value, or health content.
        retryable: { type: boolean }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 1 }
        details:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z][A-Za-z0-9.\\[\\]_-]{0,127}$' }
        code: { type: string, minLength: 1, maxLength: 64 }
        message: { type: string, minLength: 1, maxLength: 240 }
    ErrorCode:
      type: string
      enum:
        - BAD_REQUEST
        - API_VERSION_MISMATCH
        - VALIDATION_FAILED
        - FILTER_NOT_ALLOWED
        - FIELD_NOT_ALLOWED
        - AUTH_REQUIRED
        - TOKEN_AUDIENCE_INVALID
        - SCOPE_DENIED
        - FIELD_SCOPE_DENIED
        - SITE_SCOPE_DENIED
        - CROSS_SITE_REFERENCE_DENIED
        - CONSENT_REQUIRED
        - RELATIONSHIP_INVALID
        - RESOURCE_NOT_FOUND
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_CONFLICT
        - VERSION_CONFLICT
        - RESOURCE_SLOT_CONFLICT
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - DEPENDENCY_UNAVAILABLE
        - PAYMENT_STATUS_UNKNOWN
        - INTERNAL_ERROR
    FieldKey:
      type: string
      enum:
        - customer.displayName
        - customer.maskedPhone
        - relationship.relationshipType
        - relationship.status
        - consent.purposeCode
        - consent.status
        - consent.expiresAt
        - healthRecord.recordType
        - healthRecord.occurredAt
        - healthRecord.reportAvailable
        - service.serviceCode
        - service.name
        - service.status
        - appointment.status
        - appointment.startsAt
        - appointment.endsAt
        - workOrder.status
        - serviceRecord.recordedAt
        - serviceRecord.status
        - followUp.status
        - followUp.dueAt
        - notification.status
        - serviceRight.status
        - serviceRight.validTo
        - serviceLedger.entryType
        - serviceLedger.occurredAt
      description: Projection allowlist only; effective response fields are still derived from server authorization.
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        hasMore: { type: boolean }
      description: hasMore is true exactly when nextCursor is present.
    CustomerSummary:
      type: object
      additionalProperties: false
      required: [resourceType, customerId]
      properties:
        resourceType: { type: string, enum: [customer] }
        customerId: { type: string, minLength: 1, maxLength: 128 }
        displayName: { type: string, maxLength: 128 }
        maskedPhone: { type: string, maxLength: 64 }
    RelationshipSummary:
      type: object
      additionalProperties: false
      required: [resourceType, relationshipId, relationshipType, status]
      properties:
        resourceType: { type: string, enum: [relationship] }
        relationshipId: { type: string, minLength: 1, maxLength: 128 }
        relationshipType: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, minLength: 1, maxLength: 32 }
    ConsentSummary:
      type: object
      additionalProperties: false
      required: [resourceType, consentId, status]
      properties:
        resourceType: { type: string, enum: [consent] }
        consentId: { type: string, minLength: 1, maxLength: 128 }
        purposeCode: { type: string, maxLength: 64 }
        status: { type: string, minLength: 1, maxLength: 32 }
        expiresAt: { type: [string, 'null'], format: date-time }
    HealthRecordSummary:
      type: object
      additionalProperties: false
      required: [resourceType, healthRecordId]
      properties:
        resourceType: { type: string, enum: [healthRecord] }
        healthRecordId: { type: string, minLength: 1, maxLength: 128 }
        recordType: { type: string, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
        reportAvailable: { type: boolean }
      description: Metadata only; no health payload or free text is present in v1 list DTOs.
    ServiceSummary:
      type: object
      additionalProperties: false
      required: [resourceType, serviceId, serviceCode, name, status]
      properties:
        resourceType: { type: string, enum: [service] }
        serviceId: { type: string, minLength: 1, maxLength: 128 }
        serviceCode: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 128 }
        status: { type: string, maxLength: 32 }
    AppointmentSummary:
      type: object
      additionalProperties: false
      required: [resourceType, appointmentId, status]
      properties:
        resourceType: { type: string, enum: [appointment] }
        appointmentId: { type: string, minLength: 1, maxLength: 128 }
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          description: Client-visible GOV-06 baseline; internal hold/payment states are not exposed as client status values.
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    WorkOrderSummary:
      type: object
      additionalProperties: false
      required: [resourceType, workOrderId, status]
      properties:
        resourceType: { type: string, enum: [workOrder] }
        workOrderId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, maxLength: 32 }
    ServiceRecordSummary:
      type: object
      additionalProperties: false
      required: [resourceType, serviceRecordId]
      properties:
        resourceType: { type: string, enum: [serviceRecord] }
        serviceRecordId: { type: string, minLength: 1, maxLength: 128 }
        recordedAt: { type: string, format: date-time }
        status: { type: string, maxLength: 32 }
      description: Reference metadata only; service note and health content are excluded from the list DTO.
    FollowUpSummary:
      type: object
      additionalProperties: false
      required: [resourceType, followUpId, status]
      properties:
        resourceType: { type: string, enum: [followUp] }
        followUpId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [PENDING, COMPLETED] }
        dueAt: { type: [string, 'null'], format: date-time }
    NotificationSummary:
      type: object
      additionalProperties: false
      required: [resourceType, notificationId, status]
      properties:
        resourceType: { type: string, enum: [notification] }
        notificationId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, maxLength: 32 }
    ServiceRightSummary:
      type: object
      additionalProperties: false
      required: [resourceType, serviceRightId, status]
      properties:
        resourceType: { type: string, enum: [serviceRight] }
        serviceRightId: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ACTIVE, FROZEN, EXPIRED] }
        validTo: { type: [string, 'null'], format: date-time }
    ServiceLedgerSummary:
      type: object
      additionalProperties: false
      required: [resourceType, entryId, entryType, occurredAt]
      properties:
        resourceType: { type: string, enum: [serviceLedgerEntry] }
        entryId: { type: string, minLength: 1, maxLength: 128 }
        entryType: { type: string, maxLength: 64 }
        occurredAt: { type: string, format: date-time }
      description: No monetary amount, customer identity, or Commerce/MER facts are exposed by this summary.
    WishCollectionData:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            oneOf:
              - { $ref: '#/components/schemas/CustomerSummary' }
              - { $ref: '#/components/schemas/RelationshipSummary' }
              - { $ref: '#/components/schemas/ConsentSummary' }
              - { $ref: '#/components/schemas/HealthRecordSummary' }
              - { $ref: '#/components/schemas/ServiceSummary' }
              - { $ref: '#/components/schemas/AppointmentSummary' }
              - { $ref: '#/components/schemas/WorkOrderSummary' }
              - { $ref: '#/components/schemas/ServiceRecordSummary' }
              - { $ref: '#/components/schemas/FollowUpSummary' }
              - { $ref: '#/components/schemas/NotificationSummary' }
              - { $ref: '#/components/schemas/ServiceRightSummary' }
              - { $ref: '#/components/schemas/ServiceLedgerSummary' }
        nextCursor: { type: [string, 'null'], minLength: 1, maxLength: 2048 }
        hasMore: { type: boolean }
      description: hasMore is true exactly when nextCursor is present.
    WishCollectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/WishSuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/WishCollectionData' }
    Appointment:
      type: object
      additionalProperties: false
      required: [resourceType, appointmentId, status]
      properties:
        resourceType: { type: string, enum: [appointment] }
        appointmentId: { type: string, minLength: 1, maxLength: 128 }
        status:
          type: string
          enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED]
          description: Client-visible GOV-06 baseline; internal hold/payment states are not exposed as client status values.
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        holdExpiresAt: { type: [string, 'null'], format: date-time }
        paymentRequirement: { type: string, enum: [NONE, REQUIRED, UNKNOWN] }
    AppointmentEnvelope:
      allOf:
        - $ref: '#/components/schemas/WishSuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: { $ref: '#/components/schemas/Appointment' }
    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [serviceId, startsAt]
      properties:
        siteId:
          type: string
          minLength: 1
          maxLength: 128
          description: Selection hint only; validated against the caller's resolved tenant/site access and service/resource ownership.
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
          description: Selection hint only; valid relationship, purpose, and consent are resolved and checked by Wish.
        serviceId: { type: string, minLength: 1, maxLength: 128 }
        serviceVersionId: { type: string, minLength: 1, maxLength: 128 }
        startsAt: { type: string, format: date-time, description: UTC RFC 3339 timestamp. }
        resourcePreference:
          type: array
          uniqueItems: true
          maxItems: 8
          items: { type: string, enum: [practitioner, room, device] }
    CancelAppointmentRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode: { type: string, maxLength: 64 }
        reasonText: { type: string, maxLength: 240, description: User-provided cancellation reason; never copied into logs or public error messages. }
    FieldSelectionAllowlist:
      description: >-
        Per-resource projection allowlists are the corresponding FIELD_ALLOWLISTS
        entries in the standard-library contract module. A request projection is
        intersected with server-resolved field_scope; sensitive health fields
        remain unavailable unless separately approved and consented.
      type: object
